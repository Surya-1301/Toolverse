
org.gradle.jvmargs=-Xmx1536m
# Pin Gradle to JDK 21 locally if needed (Gradle 8.x cannot run on Java 25,
# e.g. VS Code's Java extension shipping a JRE 25 runtime which causes:
# "BUG! exception in phase 'semantic analysis' ... Unsupported class file major version 69").
# Do NOT hardcode org.gradle.java.home here — this file runs on CI (ubuntu-latest)
# where the JDK lives at a different path (actions/setup-java sets JAVA_HOME).
# For a local override, put e.g.
#   org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
# in ~/.gradle/gradle.properties instead.

android.useAndroidX=true
