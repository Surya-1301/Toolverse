# Toolverse download server — self-hosted yt-dlp backend.
#
# Recommended: any VPS / always-on machine with Docker.
#   1. docker compose up -d
#   2. Test: curl http://localhost:3000/
#
# See README.md for Render.com deployment instructions.

services:
  yt-backend:
    build: ./yt-backend
    container_name: toolverse-yt-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - API_KEY=${API_KEY:-}
      - COOKIES_B64=${COOKIES_B64:-}
    volumes:
      - ./yt-backend/cookies.txt:/app/cookies.txt:ro
