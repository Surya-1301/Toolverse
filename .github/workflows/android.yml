name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip > /dev/null
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Enable fullscreen (hide status bar)
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          if "android:windowFullscreen" not in s:
              s2, n = re.subn(
                  r'(<style name="AppTheme"[^>]*>)',
                  r'\1\n        <item name="android:windowFullscreen">true</item>',
                  s,
                  count=1,
              )
              if n:
                  open(p, "w").write(s2)
                  print("fullscreen enabled in AppTheme")
              else:
                  print("AppTheme style not found, no change made")
          else:
              print("fullscreen already set")
          EOF

      - name: Apply Toolverse app icons
        run: |
          SRC=$(dirname "$(find . -path ./node_modules -prune -o -type d -name 'mipmap-xxxhdpi' -print | head -1)")
          if [ -z "$SRC" ]; then echo "android-icons folder not found"; exit 1; fi
          echo "Copying icons from $SRC"
          cp -r "$SRC"/mipmap-* android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          # Maven Central sometimes rate-limits GitHub runners (429s) — retry a few times
          for i in 1 2 3; do
            if ./gradlew assembleDebug; then
              echo "Gradle build succeeded on attempt $i"
              break
            fi
            echo "Gradle attempt $i failed, waiting 90s before retry..."
            sleep 90
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "toolverse-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolverse-apk
          path: toolverse-*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: toolverse-*.apk
